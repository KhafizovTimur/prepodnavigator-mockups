name: Кафедра Онлайн · публикация расписания
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kafedra-pages-production
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить импорт и собрать актуальные карточки
        working-directory: project
        run: |
          python3 -m unittest discover -s tests
          gzip -dc data/schedule.sqlite3.gz > data/schedule.sqlite3
          python3 -m timetable.export_pages "$RUNNER_TEMP/site/schedule"
      - name: Добавить главную страницу и макеты
        run: cp -R .nojekyll index.html app.js style.css assets evidence "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4

